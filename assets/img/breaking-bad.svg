<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200" role="img" aria-label="Breaking Bad">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
